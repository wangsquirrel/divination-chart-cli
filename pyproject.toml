[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project]
name = "divination-chart-cli"
version = "0.2.0"
description = "Agent-friendly JSON CLI for divicast six-line and Bazi charts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "divicast>=0.2.4,<0.3.0",
]

[project.scripts]
divination-chart-cli = "divination_chart_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = true
